<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Boleto & Bocado</title>
    <!-- Vinculamos tu archivo CSS existente para heredar los colores -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos específicos para centrar la pantalla de login */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            position: relative;
        }

        .login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.85); /* Fondo oscuro para resaltar la tarjeta */
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 2;
            background-color: var(--blanco, #ffffff);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid var(--naranja-barro, #d35400);
        }

        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .login-container h2 {
            color: var(--terracota, #5c1e06);
            margin-bottom: 25px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--texto-oscuro, #2c3e50);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--naranja-barro, #d35400);
            box-shadow: 0 0 8px rgba(211, 84, 0, 0.2);
        }

        .btn-ingresar {
            width: 100%;
            background-color: var(--naranja-barro, #d35400);
            color: var(--blanco, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-ingresar:hover {
            background-color: var(--terracota, #5c1e06);
            transform: translateY(-2px);
        }

        .back-link {
            color: var(--texto-oscuro, #2c3e50);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
            display: inline-block;
        }

        .back-link:hover {
            color: var(--naranja-barro, #d35400);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-overlay"></div>
        
        <div class="login-container">
            <!-- Usa el mismo logo circular -->
            <img src="boleto_bocado.jpeg" alt="Logo Boleto y Bocado" class="login-logo">
            <h2>Acceso Admin</h2>
            
            <!-- Formulario que simula el acceso -->
       <form id="loginForm" onsubmit="validarLogin(event)">
                 <div class="form-group">
        <labe for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Administrador" required>
    </div>
    
    <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
    </div>
    
    <button type="submit" class="btn-ingresar">Entrar al Sistema</button>
</form>
            <a href="index.html" class="back-link">Regresar a la tienda</a>
        </div>
    </div>

    <script>
    async function validarLogin(event) {
        event.preventDefault(); // Evita que la página se recargue
        
        const usuarioInput = document.getElementById("usuario").value;
        const passwordInput = document.getElementById("password").value;
        
        try {
            const respuesta = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    usuario: usuarioInput, 
                    password: passwordInput 
                })
            });
            
            const datos = await respuesta.json();
            
            if (datos.success) {
                // Si el servidor dice "success: true", lo mandamos al Dashboard
                window.location.href = 'admin-dashboard.html';
            } else {
                // Si falla, mostramos error
                alert('Usuario o contraseña incorrectos. Intenta de nuevo.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert("Error al conectar con el servidor. ¿Está corriendo server.js?");
        }
    }
</script>

</body>
</html>
